<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuizNova | Quiz Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-orb orb-1"></div><div class="bg-orb orb-2"></div><div class="bg-orb orb-3"></div>

  <nav class="navbar navbar-expand-lg navbar-dark glass-nav px-3 px-lg-5">
    <a class="navbar-brand fw-bold" href="#"><span class="brand-dot"></span> QuizNova</a>
    <div class="ms-auto d-flex align-items-center gap-2">
      <span id="navUser" class="small text-secondary"></span>
      <button id="logoutBtn" class="btn btn-outline-light btn-sm d-none"><i class="bi bi-box-arrow-right"></i> Logout</button>
    </div>
  </nav>

  <main class="container py-5">
    <section id="authView" class="auth-wrap">
      <div class="hero-copy text-center mb-4">
        <div class="badge-soft mb-3"><i class="bi bi-stars"></i> Smart Quiz Management</div>
        <h1 class="display-4 fw-bold">Test. Learn. <span>Level Up.</span></h1>
        <p class="lead text-secondary">A modern quiz platform for students and administrators.</p>
      </div>

      <div class="auth-card glass-card mx-auto">
        <ul class="nav nav-pills nav-fill auth-tabs mb-4">
          <li class="nav-item"><button class="nav-link active" data-auth-tab="login">Login</button></li>
          <li class="nav-item"><button class="nav-link" data-auth-tab="register">Register</button></li>
        </ul>

        <form id="loginForm">
          <h3 class="mb-1">Welcome back</h3><p class="text-secondary mb-4">Sign in to continue.</p>
          <div class="mb-3"><label>Email</label><input id="loginEmail" type="email" class="form-control" required></div>
          <div class="mb-3"><label>Password</label><input id="loginPassword" type="password" class="form-control" required></div>
          <button class="btn btn-primary w-100 btn-glow" type="submit">Login <i class="bi bi-arrow-right"></i></button>
        </form>

        <form id="registerForm" class="d-none">
          <h3 class="mb-1">Create account</h3><p class="text-secondary mb-4">Join as a student or administrator.</p>
          <div class="mb-3"><label>Full name</label><input id="regName" class="form-control" required></div>
          <div class="mb-3"><label>Email</label><input id="regEmail" type="email" class="form-control" required></div>
          <div class="mb-3"><label>Password</label><input id="regPassword" type="password" minlength="6" class="form-control" required></div>
          <div class="mb-3"><label>Account type</label><select id="regRole" class="form-select"><option value="student">Student</option><option value="admin">Admin</option></select></div>
          <div id="adminCodeWrap" class="mb-3 d-none"><label>Admin registration code</label><input id="adminCode" class="form-control" placeholder="Use the code configured in app.js"></div>
          <button class="btn btn-primary w-100 btn-glow" type="submit">Create account <i class="bi bi-person-plus"></i></button>
        </form>
      </div>
    </section>

    <section id="dashboardView" class="d-none">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
        <div><div class="badge-soft mb-2" id="roleBadge">Dashboard</div><h2 id="welcomeTitle" class="fw-bold mb-0"></h2></div>
        <button id="refreshBtn" class="btn btn-outline-light"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
      </div>
      <div id="dashboardContent"></div>
    </section>
  </main>

  <div class="modal fade" id="quizModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content glass-modal">
    <div class="modal-header"><h5 id="quizModalTitle" class="modal-title">Create Quiz</h5><button class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
    <div class="modal-body"><form id="quizForm">
      <input type="hidden" id="quizId">
      <div class="row g-3"><div class="col-md-8"><label>Quiz title</label><input id="quizTitle" class="form-control" required></div><div class="col-md-4"><label>Duration (minutes)</label><input id="quizDuration" type="number" min="1" value="10" class="form-control" required></div></div>
      <div class="mt-3"><label>Description</label><textarea id="quizDescription" class="form-control" rows="2"></textarea></div>
      <div id="questionsContainer" class="mt-4"></div>
      <button type="button" id="addQuestionBtn" class="btn btn-outline-light mt-2"><i class="bi bi-plus-circle"></i> Add Question</button>
      <button class="btn btn-primary btn-glow w-100 mt-4" type="submit">Save Quiz</button>
    </form></div>
  </div></div></div>

  <div class="modal fade" id="attemptModal" tabindex="-1" data-bs-backdrop="static"><div class="modal-dialog modal-xl modal-dialog-centered"><div class="modal-content glass-modal">
    <div class="modal-header"><div><h5 id="attemptTitle" class="mb-1"></h5><small id="progressText" class="text-secondary"></small></div><div class="timer-pill"><i class="bi bi-stopwatch"></i> <span id="timer">00:00</span></div></div>
    <div class="modal-body"><div class="progress mb-4"><div id="quizProgress" class="progress-bar" style="width:0%"></div></div><div id="questionArea"></div></div>
    <div class="modal-footer justify-content-between"><button id="prevQuestion" class="btn btn-outline-light">← Previous</button><button id="nextQuestion" class="btn btn-primary btn-glow">Next →</button><button id="submitQuiz" class="btn btn-success d-none">Submit Quiz</button></div>
  </div></div></div>

  <div class="modal fade" id="resultModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content glass-modal text-center"><div class="modal-body p-5">
    <div class="score-ring mx-auto mb-4"><span id="scoreValue">0</span><small>/ 0</small></div><h3 id="resultTitle"></h3><p id="resultMessage" class="text-secondary"></p><button class="btn btn-primary btn-glow" data-bs-dismiss="modal">Back to dashboard</button>
  </div></div></div></div>

  <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
